<!doctype html>
<html lang="hi" translate="no">
<head>
<meta charset="utf-8">

<style>body{box-sizing:border-box;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}</style>
<title>ज़ोन रश</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Single dark look by choice: full-screen 3D view with a thin HUD around the edges and thumb controls at the bottom on phones. */
:root { color-scheme: dark; --bg:#0b1118; --fg:#f2f6f4; --muted:#9db0a8; --accent:#ff7a2f; --accent-fg:#1a0d04; --hp:#38d39f; --warn:#ff4a3d; --panel:rgba(11,17,24,.72); --font-head:"Space Grotesk","Segoe UI",system-ui,sans-serif; }
html, body { height:100%; margin:0; }
[hidden] { display:none !important; }
body { background:var(--bg); color:var(--fg); font-family:"Segoe UI",system-ui,sans-serif; overflow:hidden; }
#game { position:relative; width:100%; height:100%; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; background:var(--bg); }
#game canvas { display:block; }
.hud { position:absolute; pointer-events:none; font-variant-numeric:tabular-nums; }
.pill { background:var(--panel); border-radius:8px; padding:6px 10px; font-size:.9rem; font-weight:600; }
#stats { top:10px; left:10px; display:flex; flex-direction:column; gap:6px; }
#hpWrap { width:130px; height:10px; background:rgba(255,255,255,.18); border-radius:6px; overflow:hidden; }
#hpBar { height:100%; width:100%; background:var(--hp); transition:width .15s; }
#zoneInfo { top:84px; left:10px; text-align:left; max-width:46%; font-size:.68rem; padding:4px 8px; }
#statTxt { font-size:.75rem; }
#ammo { top:10px; right:10px; font-size:.78rem; }
#cross { top:50%; left:50%; width:22px; height:22px; margin:-11px 0 0 -11px; }
#cross::before, #cross::after { content:""; position:absolute; background:#fff; opacity:.9; }
#cross::before { left:10px; top:0; width:2px; height:22px; }
#cross::after { top:10px; left:0; height:2px; width:22px; }
#hit { top:50%; left:50%; width:30px; height:30px; margin:-15px 0 0 -15px; opacity:0; color:#fff; font-size:30px; line-height:30px; text-align:center; font-weight:700; transition:opacity .12s; }
#flash { inset:0; background:radial-gradient(circle,transparent 40%,var(--warn) 140%); opacity:0; }
#toast { top:22%; left:50%; transform:translateX(-50%); opacity:0; transition:opacity .2s; background:var(--panel); padding:8px 16px; border-radius:8px; font-weight:700; }
#zoneWarn { top:16%; left:50%; transform:translateX(-50%); color:var(--warn); font-weight:700; background:var(--panel); padding:6px 12px; border-radius:8px; }
.ctl { display:none; position:absolute; touch-action:none; }
body.touch .ctl { display:block; }
#joy { left:22px; bottom:24px; width:108px; height:108px; border-radius:50%; background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.25); }
#knob { position:absolute; left:36px; top:36px; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.55); }
#fireBtn { right:24px; bottom:26px; width:70px; height:70px; border-radius:50%; background:rgba(255,122,47,.75); border:2px solid #fff; color:#fff; font-weight:700; display:none; align-items:center; justify-content:center; font-size:.8rem; }
body.touch #fireBtn { display:flex; }
#rldBtn { right:104px; bottom:30px; width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.5); color:#fff; font-weight:700; display:none; align-items:center; justify-content:center; font-size:.6rem; }
body.touch #rldBtn { display:flex; }
#sbar { position:absolute; top:52px; right:10px; display:none; gap:8px; z-index:3; }
body.touch #sbar { display:flex; }
.sbtn { width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.45); color:#fff; font-size:.55rem; font-weight:600; display:flex; align-items:center; justify-content:center; touch-action:none; }
.sbtn.on { background:var(--accent); color:var(--accent-fg); border-color:#fff; }
.abtn { position:absolute; right:24px; min-width:56px; height:38px; padding:0 12px; border-radius:19px; border:2px solid #fff; color:#1a1405; font-weight:700; font-size:.75rem; display:flex; align-items:center; justify-content:center; z-index:3; touch-action:none; cursor:pointer; }
#vaultBtn { bottom:106px; background:rgba(255,200,61,.92); }
body.driving #carBtn { bottom:40px; }
body.driving #fireBtn, body.driving #rldBtn, body.driving #swapBtn, body.driving #runBtn, body.driving #sbar, body.driving #cross, body.driving #pickBtn, body.driving #vaultBtn { display:none !important; }
#carBtn { bottom:198px; background:rgba(120,190,255,.95); }
#pickBtn { bottom:152px; background:rgba(120,220,140,.95); }
#swapBtn { right:156px; bottom:30px; width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.5); color:#fff; font-weight:700; display:none; align-items:center; justify-content:center; font-size:.6rem; }
body.touch #swapBtn { display:flex; }
#runBtn { left:22px; bottom:142px; width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.5); color:#fff; font-weight:700; display:none; align-items:center; justify-content:center; font-size:.6rem; }
#runBtn.on { background:rgba(255,122,47,.85); border-color:#fff; }
body.touch #runBtn { display:flex; }
.gico { width:64px; height:22px; flex:none; }
#arWrap { width:130px; height:6px; background:rgba(255,255,255,.18); border-radius:6px; overflow:hidden; }
#arBar { height:100%; width:0; background:#6f8cff; transition:width .15s; }
#bagPanel { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(92%,380px); max-height:88%; overflow:hidden; background:rgba(11,17,24,.95); border:1px solid rgba(255,255,255,.2); border-radius:14px; padding:12px; z-index:6; }
#bagPanel h2 { margin:0 0 6px; font-family:var(--font-head); font-size:1.1rem; }
.bsec { margin:8px 0 4px; font-size:.72rem; letter-spacing:.08em; color:var(--muted); }
.brow { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:4px 8px; border-radius:8px; background:rgba(255,255,255,.07); margin-bottom:4px; font-size:.8rem; }
.brow.dim { opacity:.55; }
.brow.on { outline:2px solid var(--accent); }
.bbtn { font-size:.8rem; font:inherit; cursor:pointer; border:0; border-radius:8px; padding:6px 12px; background:var(--accent); color:var(--accent-fg); font-weight:700; }
@media (max-height:420px) { #overlay h1 { font-size:1.5rem; } #overlay { gap:8px; padding:10px; } #overlay p { font-size:.8rem; } }
#scopeOv { inset:0; background:radial-gradient(circle at 50% 50%, transparent 0, transparent 30vmin, #000 30.4vmin); }
#scopeOv::before, #scopeOv::after { content:""; position:absolute; background:rgba(0,0,0,.85); }
#scopeOv::before { left:0; right:0; top:50%; height:2px; margin-top:-1px; }
#scopeOv::after { top:0; bottom:0; left:50%; width:2px; margin-left:-1px; }
#overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding:20px; background:rgba(11,17,24,.78); z-index:5; }
#overlay h1 { font-family:var(--font-head); font-size:2.2rem; margin:0; text-wrap:balance; }
#overlay p { margin:0; color:var(--muted); max-width:38ch; line-height:1.5; font-size:.95rem; }
.btn { font:inherit; cursor:pointer; background:var(--accent); color:var(--accent-fg); border:0; border-radius:10px; padding:13px 34px; font-weight:700; font-size:1.05rem; }
.btn:focus-visible { outline:3px solid #fff; outline-offset:2px; }
</style>
</head><body>
<div id="game">
  <div class="hud" id="scopeOv" hidden></div>
  <div class="hud" id="stats">
    <div class="pill" id="statTxt">बचे: 30 · किल: 0</div>
    <div id="hpWrap"><div id="hpBar"></div></div>
    <div id="arWrap"><div id="arBar"></div></div>
  </div>
  <div class="hud pill" id="zoneInfo">ज़ोन</div>
  <div class="hud pill" id="ammo">30 / ∞</div>
  <div class="hud" id="cross"></div>
  <div class="hud" id="hit">✕</div>
  <div class="hud" id="flash"></div>
  <div class="hud" id="toast"></div>
  <div class="hud" id="zoneWarn" hidden>ज़ोन से बाहर हैं, अंदर जाइए!</div>
  <div class="ctl" id="joy"><div id="knob"></div></div>
  <div class="ctl" id="rldBtn">रीलोड</div>
  <div class="ctl" id="fireBtn">फ़ायर</div>
  <div class="ctl" id="swapBtn">बदलें</div>
  <div class="ctl" id="runBtn">दौड़ें</div>
  <div id="sbar">
    <div class="sbtn" id="camBtn">कैमरा</div>
    <div class="sbtn" id="muteBtn">ध्वनि</div>
    <div class="sbtn" id="scopeBtn">स्कोप</div>
    <div class="sbtn" id="bagBtn">बैग</div>
  </div>
  <div class="abtn" id="vaultBtn" hidden>कूदें</div>
  <div class="abtn" id="pickBtn" hidden>उठाएँ</div>
  <div class="abtn" id="carBtn" hidden>बैठें</div>
  <div id="bagPanel" hidden><div id="bagBody"></div></div>
  <div id="overlay">
    <h1 id="ovTitle">ज़ोन रश</h1>
    <p id="ovText">30 खिलाड़ियों के मैच में आख़िरी तक बचिए। सिकुड़ते लाल ज़ोन के अंदर रहिए और बाक़ी सबको हराइए।</p>
    <p id="ovHelp"></p>
    <button class="btn" id="startBtn" type="button">मैच शुरू करें</button>
    <p style="font-size:.75rem;opacity:.7">संस्करण 18 · असली इंसान जैसा किरदार</p>
  </div>
</div>

<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var game = $('game');
  var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) document.body.classList.add('touch');
  $('ovHelp').textContent = isTouch
    ? 'बायाँ गोला: चलना · उँगली घुमाना: देखना · दाएँ: फ़ायर, रीलोड, बदलें · "दौड़ें" बटन दबाकर तेज़ दौड़िए, फिर दबाकर वापस चलिए · ऊपर दाएँ: कैमरा, आवाज़, स्कोप, बैग · चमकता सामान उठाइए, हथियार "उठाएँ" बटन से · पीली खिड़की के पास "कूदें" · गाड़ी (बाइक, कार, रिक्शा) के पास नीला "बैठें" बटन: जोयस्टिक से चलाइए, टक्कर से दुश्मन गिरता है, "उतरें" से बाहर।'
    : 'W A S D: चलना · माउस: देखना · क्लिक या Space: फ़ायर · R: रीलोड · Shift दबाए रखें: दौड़ना (वरना धीमा चलना) · V: कैमरा · M: आवाज़ · दायाँ क्लिक या Z: स्कोप · E: उठाना, गाड़ी में बैठना/उतरना या खिड़की से कूदना · B: बैग · 1/2/3 या Q: हथियार बदलना · H: इलाज किट।';
  if (typeof THREE === 'undefined') {
    $('ovText').textContent = '3D लाइब्रेरी लोड नहीं हुई। पेज दोबारा खोलिए।';
    $('startBtn').hidden = true; return;
  }

  var WORLD_R = 153, ZONE0 = 148;
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9ec9e8);
  scene.fog = new THREE.Fog(0x9ec9e8, 45, 170);
  var camera = new THREE.PerspectiveCamera(75, 1, 0.1, 230);
  camera.rotation.order = 'YXZ';
  scene.add(camera);
  var renderer = new THREE.WebGLRenderer({ antialias: !isTouch });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2));
  game.insertBefore(renderer.domElement, game.firstChild);
  function resize() {
    var w = game.clientWidth || 400, h = game.clientHeight || 300;
    renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  scene.add(new THREE.HemisphereLight(0xffffff, 0x6c8a5a, 0.85));
  var sun = new THREE.DirectionalLight(0xfff2d6, 0.6); sun.position.set(40, 80, 20); scene.add(sun);
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(560, 560), new THREE.MeshLambertMaterial({ color: 0x5f9c4d }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);

  var obstacles = [], obsMeshes = [];
  function addBox(x, z, w, h, d, color) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: color }));
    m.position.set(x, h / 2, z); scene.add(m);
    obstacles.push({ x0: x - w / 2, x1: x + w / 2, z0: z - d / 2, z1: z + d / 2 });
    obsMeshes.push(m);
  }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  var houses = [], windows = [];
  function blocked(x, z, pad) {
    for (var i = 0; i < obstacles.length; i++) {
      var o = obstacles[i];
      if (x > o.x0 - pad && x < o.x1 + pad && z > o.z0 - pad && z < o.z1 + pad) return true;
    }
    for (var j = 0; j < houses.length; j++) {
      var h = houses[j];
      if (x > h.x0 - pad && x < h.x1 + pad && z > h.z0 - pad && z < h.z1 + pad) return true;
    }
    return false;
  }
  var wallCols = [0xe3d5b8, 0xc9d3dc, 0xe8c9a8, 0xd9e0c8, 0xe0b8a0];
  var roofCols = [0x9c4a32, 0x6b4a3a, 0x4f5d6b, 0x8a3b30];
  var frameMat = new THREE.MeshBasicMaterial({ color: 0xffc83d });

  /* घर: चार दीवारें (एक में दरवाज़ा, बाक़ी में खिड़की), फ़र्श, छत और अंदर मेज़ */
  function addHouse(cx, cz, w, d, doorSide, wcol, rcol) {
    var H = 3.2, t = 0.4, x0 = cx - w / 2, x1 = cx + w / 2, z0 = cz - d / 2, z1 = cz + d / 2;
    var wm = new THREE.MeshLambertMaterial({ color: wcol });
    function run(axis, fixed, a, b, ops) {
      ops.sort(function (p, q) { return p.c - q.c; });
      var cur = a;
      function seg(s, e, y0, y1, solid) {
        var len = e - s, h = y1 - y0; if (len < 0.02 || h < 0.02) return;
        var mid = (s + e) / 2, sx = axis === 'x' ? len : t, sz = axis === 'x' ? t : len;
        var px = axis === 'x' ? mid : fixed, pz = axis === 'x' ? fixed : mid;
        var m = new THREE.Mesh(new THREE.BoxGeometry(sx, h, sz), wm);
        m.position.set(px, y0 + h / 2, pz); scene.add(m); obsMeshes.push(m);
        if (solid) obstacles.push({ x0: px - sx / 2, x1: px + sx / 2, z0: pz - sz / 2, z1: pz + sz / 2 });
      }
      for (var i = 0; i < ops.length; i++) {
        var o = ops[i], s = o.c - o.w / 2, e = o.c + o.w / 2;
        seg(cur, s, 0, H, true);
        if (o.door) seg(s, e, 2.4, H, false);
        else { seg(s, e, 0, 1.0, true); seg(s, e, 2.2, H, false); windows.push({ axis: axis, fixed: fixed, c: o.c }); frame(axis, fixed, o.c, o.w); }
        cur = e;
      }
      seg(cur, b, 0, H, true);
    }
    /* खिड़की के चारों तरफ़ पीला फ़्रेम: यह कूदने की जगह का निशान है */
    function frame(axis, fixed, c, wd) {
      var th = t + 0.1, bar = 0.09, X = axis === 'x';
      function box(sx, sy, sz, px, py, pz) { var m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), frameMat); m.position.set(px, py, pz); scene.add(m); }
      box(X ? wd + 0.2 : th, bar, X ? th : wd + 0.2, X ? c : fixed, 1.0 + bar / 2, X ? fixed : c);
      box(X ? wd + 0.2 : th, bar, X ? th : wd + 0.2, X ? c : fixed, 2.2 - bar / 2, X ? fixed : c);
      box(X ? bar : th, 1.2, X ? th : bar, X ? c - wd / 2 - bar / 2 : fixed, 1.6, X ? fixed : c - wd / 2 - bar / 2);
      box(X ? bar : th, 1.2, X ? th : bar, X ? c + wd / 2 + bar / 2 : fixed, 1.6, X ? fixed : c + wd / 2 + bar / 2);
    }
    function wallOps(side, mid, len) {
      return side === doorSide ? [{ c: mid + rnd(-len / 6, len / 6), w: 2.2, door: true }] : [{ c: mid, w: 1.6 }];
    }
    run('x', z0, x0 - t / 2, x1 + t / 2, wallOps(0, cx, w));
    run('x', z1, x0 - t / 2, x1 + t / 2, wallOps(1, cx, w));
    run('z', x0, z0 + t / 2, z1 - t / 2, wallOps(2, cz, d));
    run('z', x1, z0 + t / 2, z1 - t / 2, wallOps(3, cz, d));
    var fl = new THREE.Mesh(new THREE.BoxGeometry(w, 0.04, d), new THREE.MeshLambertMaterial({ color: 0x7a6048 }));
    fl.position.set(cx, 0.02, cz); scene.add(fl);
    var ce = new THREE.Mesh(new THREE.BoxGeometry(w + t, 0.15, d + t), new THREE.MeshLambertMaterial({ color: 0x6b5a48 }));
    ce.position.set(cx, H + 0.075, cz); scene.add(ce);
    var rg = new THREE.ConeGeometry((w / 2 + 0.6) * 1.4142, 1.9, 4); rg.rotateY(Math.PI / 4);
    var roof = new THREE.Mesh(rg, new THREE.MeshLambertMaterial({ color: rcol }));
    roof.scale.z = (d / 2 + 0.6) / (w / 2 + 0.6); roof.position.set(cx, H + 0.95, cz); scene.add(roof); obsMeshes.push(roof);
    addBox(cx + rnd(-w / 6, w / 6), cz + rnd(-d / 6, d / 6), 1.4, 0.9, 0.9, 0x7a5230);
    houses.push({ x0: x0 - t / 2, x1: x1 + t / 2, z0: z0 - t / 2, z1: z1 + t / 2 });
  }
  var placed = 0, guard = 0;
  while (placed < 30 && guard++ < 2000) {
    var a = rnd(0, 6.283), r = Math.sqrt(Math.random()) * 126;
    var bx = Math.cos(a) * r, bz = Math.sin(a) * r, bw = rnd(8, 12), bd = rnd(7, 10);
    if (blocked(bx, bz, Math.max(bw, bd) * 0.5 + 4)) continue;
    addHouse(bx, bz, bw, bd, Math.floor(Math.random() * 4), wallCols[Math.floor(Math.random() * wallCols.length)], roofCols[Math.floor(Math.random() * roofCols.length)]); placed++;
  }
  placed = 0; guard = 0;
  while (placed < 40 && guard++ < 800) {
    var a2 = rnd(0, 6.283), r2 = Math.sqrt(Math.random()) * 142, cx = Math.cos(a2) * r2, cz = Math.sin(a2) * r2;
    if (blocked(cx, cz, 3)) continue;
    addBox(cx, cz, 2, 1.4, 2, 0x8a5a2b); placed++;
  }
  var trunkMat = new THREE.MeshLambertMaterial({ color: 0x6b4a2b }), leafMat = new THREE.MeshLambertMaterial({ color: 0x2f7a3c });
  placed = 0; guard = 0;
  while (placed < 90 && guard++ < 1000) {
    var a3 = rnd(0, 6.283), r3 = Math.sqrt(Math.random()) * 148, tx = Math.cos(a3) * r3, tz = Math.sin(a3) * r3;
    if (blocked(tx, tz, 2)) continue;
    var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 3, 6), trunkMat);
    trunk.position.set(tx, 1.5, tz); scene.add(trunk); obsMeshes.push(trunk);
    obstacles.push({ x0: tx - 0.4, x1: tx + 0.4, z0: tz - 0.4, z1: tz + 0.4 });
    var leaf = new THREE.Mesh(new THREE.ConeGeometry(2, 4.5, 7), leafMat);
    leaf.position.set(tx, 5, tz); scene.add(leaf); placed++;
  }

  var zoneMesh = new THREE.Mesh(
    new THREE.CylinderGeometry(1, 1, 70, 64, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xff3b30, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false, fog: false })
  );
  zoneMesh.position.y = 35; scene.add(zoneMesh);

  var gun = new THREE.Group();
  var gm = new THREE.MeshLambertMaterial({ color: 0x2a2f38 });

      menuYaw += dt * 0.12; camera.position.set(0, 1.65, 60); camera.rotation.set(-0.05, menuYaw, 0);
      pm.visible = false; gun.visible = false;
      zoneMesh.scale.set(ZONE0, 1, ZONE0);
    }
    renderer.render(scene, camera);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
